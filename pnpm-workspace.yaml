ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - verkit@0.1.2
  - tsdown@0.22.12
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec@1.2.2
packages:
  - server
  - package

catalogs:
  dev:
    '@antfu/eslint-config': ^9.1.0
    '@antfu/ni': ^30.2.0
    bumpp: ^11.1.0
    eslint: ^10.7.0
    lint-staged: ^17.1.0
    p-retry: ^8.0.0
    simple-git-hooks: ^2.13.1
    tinyexec: ^1.2.4
    tsdown: ^0.22.12
    tsx: ^4.23.1
    typescript: ^6.0.3
    vite: ^8.1.5
    vitest: ^4.1.10
    wait-port: ^1.1.0
    zx: ^8.8.5
  prod:
    cac: ^7.0.0
  server:
    h3: ^1.15.11
    lru-cache: ^11.5.2
    nitropack: ^2.13.4
    npm-package-arg: ^14.0.0
    ofetch: ^1.5.1
    ufo: ^1.6.4
    verkit: ^0.1.2
  types:
    '@types/node': ^26.1.1
    '@types/npm-package-arg': ^6.1.4

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: true
